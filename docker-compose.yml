name: habit_tracker

services:
  database:
    image: postgres:18-alpine
    container_name: habit_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: habit_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    depends_on:
      database:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - app_network

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: habit_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./bot:/app/bot
      - bot_logs:/app/logs
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:
  backend_logs:
  bot_logs:

networks:
  app_network:
    driver: bridge